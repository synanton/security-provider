# Development configuration. Mirrors the proposal §configuration example.
# Production mounts real certificates and keys from the secret store and
# sets SECURITY_PROVIDER_SIGNING_KEY / SECURITY_PROVIDER_ADMIN_TOKEN in
# the environment (never in this file).
server:
  http_addr: ":8080"
  grpc_addr: ":9090"
  tls:
    cert_file: /certs/service.crt
    key_file: /certs/service.key
    client_ca: /certs/client-ca.crt
    require_client_cert: false
  context_ttl: 5m
identity:
  endpoint: "https://identity.internal:8443"
  mode: stub
  timeout: 2s
  cache_ttl: 30s
providers:
  - id: synanton-workload-ca
    type: mtls
    trust_bundle: /certs/client-ca.crt
    allowed_san_patterns:
      - "spiffe://synanton/*"
    enabled: true
  - id: enterprise-oidc
    type: oidc
    issuer: "https://idp.example.com"
    audiences: ["synanton-api"]
    jwks_uri: "https://idp.example.com/.well-known/jwks.json"
    jwks_cache_ttl: 5m
    allowed_algorithms: ["RS256", "ES256"]
    enabled: false
local_verification:
  enabled: true
  ttl_high_risk: 5m
  ttl_standard: 15m
  centralized_only_operations:
    - "admin.*"
    - "tenant.*"
    - "delegation.activate"
    - "delegation.extend"
revocation:
  slo_centralized: 60s
  slo_local_high_risk: 5m
  slo_local_standard: 15m
  slo_mtls: 15m
audit:
  sink: "stdout"
  redact_credentials: true
log_level: debug
